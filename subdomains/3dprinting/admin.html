<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Print Request Queue — Chris Pivonka" />
  <meta name="author" content="Chris Pivonka" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Request Queue · 3D Printing · chrispivonka.com</title>

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --bg:           #0d1117;
      --bg-card:      #161b22;
      --bg-elevated:  #1c2128;
      --border:       #30363d;
      --border-bright:#444c56;
      --text:         #e6edf3;
      --text-muted:   #8b949e;
      --text-dim:     #484f58;
      --text-bright:  #ffffff;
      --cyan:         #58a6ff;
      --green:        #3fb950;
      --yellow:       #d29922;
      --red:          #f85149;
      --mono:         'JetBrains Mono', 'Fira Code', monospace;
      --sans:         'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 36px;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 200;
      font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim);
    }
    .status-bar-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 1.5rem;
      height: 100%; display: flex; justify-content: space-between; align-items: center;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 0.75rem; }
    #live-clock { color: var(--text-muted); }

    .site-nav {
      margin-top: 36px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; }
    .nav-brand {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    .nav-brand:hover { color: var(--cyan); }
    .nav-sep { color: var(--border-bright); font-size: 0.9rem; }
    .nav-current { font-family: var(--mono); font-size: 0.8rem; color: var(--text); }
    .nav-pill-back {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--cyan);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .nav-pill-back:hover { background: var(--cyan); color: #000; }

    .page-main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .header-card h1 {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    #message-banner {
      display: none;
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: var(--red);
    }

    .request-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .request-card.status-completed { opacity: 0.55; }
    .request-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .request-title {
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .priority-badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .priority-high { background: rgba(248, 81, 73, 0.15); color: var(--red); border: 1px solid rgba(248, 81, 73, 0.4); }
    .priority-normal { background: rgba(88, 166, 255, 0.15); color: var(--cyan); border: 1px solid rgba(88, 166, 255, 0.4); }
    .priority-low { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border); }

    .request-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.6rem;
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .request-meta div { color: var(--text-muted); }
    .request-meta span { color: var(--text); display: block; }
    .request-notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
    }
    .request-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .request-actions button, .request-actions a {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .request-actions button:hover, .request-actions a:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-danger:hover { border-color: var(--red) !important; color: var(--red) !important; }

    #empty-state, #loading-state {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .site-footer {
      max-width: 900px; margin: 0 auto; width: 100%;
      padding: 2.5rem 1.5rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
      font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header class="status-bar">
    <div class="status-bar-inner">
      <div class="status-left">
        <a href="https://chrispivonka.com" style="color: inherit; text-decoration: none;">chrispivonka.com</a>
      </div>
      <div class="status-right">
        <span id="live-clock">--:--:-- MST</span>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <div class="nav-left">
      <a href="./printing.html" class="nav-brand">
        <i class="bi bi-arrow-left"></i> 3d-printing
      </a>
      <span class="nav-sep">/</span>
      <span class="nav-current">request-queue</span>
    </div>
    <a href="./printing.html" class="nav-pill-back">← back()</a>
  </nav>

  <main class="page-main">
    <div class="header-card">
      <h1><i class="bi bi-list-check"></i> Print Request Queue</h1>
      <p>Requests submitted via the print request form.</p>
    </div>

    <div id="message-banner"></div>
    <div id="loading-state">Loading requests...</div>
    <div id="empty-state" style="display:none;">No requests yet.</div>
    <div id="request-list"></div>
  </main>

  <footer class="site-footer">
    <span>© <span id="current-year">2026</span> Chris Pivonka</span>
  </footer>

  <script type="module" src="./admin-loader.js"></script>
</body>
</html>
