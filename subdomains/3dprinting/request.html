<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Request a 3D Print — Chris Pivonka" />
  <meta name="author" content="Chris Pivonka" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Request a Print · 3D Printing · chrispivonka.com</title>

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --bg:           #0d1117;
      --bg-card:      #161b22;
      --bg-elevated:  #1c2128;
      --border:       #30363d;
      --border-bright:#444c56;
      --text:         #e6edf3;
      --text-muted:   #8b949e;
      --text-dim:     #484f58;
      --text-bright:  #ffffff;
      --cyan:         #58a6ff;
      --green:        #3fb950;
      --yellow:       #d29922;
      --red:          #f85149;
      --mono:         'JetBrains Mono', 'Fira Code', monospace;
      --sans:         'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 36px;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 200;
      font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim);
    }
    .status-bar-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 1.5rem;
      height: 100%; display: flex; justify-content: space-between; align-items: center;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 0.75rem; }
    .status-separator { color: var(--border-bright); }
    #live-clock { color: var(--text-muted); }

    .site-nav {
      margin-top: 36px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; }
    .nav-brand {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    .nav-brand:hover { color: var(--cyan); }
    .nav-sep { color: var(--border-bright); font-size: 0.9rem; }
    .nav-current { font-family: var(--mono); font-size: 0.8rem; color: var(--text); }
    .nav-pill-back {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--cyan);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .nav-pill-back:hover { background: var(--cyan); color: #000; }

    .page-main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .header-card h1 {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    label {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 0.4rem;
    }
    input, select, textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 0.6rem 0.7rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--cyan);
    }
    textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .file-drop {
      border: 1px dashed var(--border-bright);
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .file-drop:hover, .file-drop.drag-over { border-color: var(--cyan); color: var(--cyan); }
    .file-drop i { font-size: 1.5rem; display: block; margin-bottom: 0.4rem; }
    .file-drop .file-name { color: var(--green); font-family: var(--mono); font-size: 0.8rem; margin-top: 0.4rem; }

    button[type="submit"] {
      background: var(--cyan);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button[type="submit"]:hover { opacity: 0.85; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    #form-status {
      font-family: var(--mono);
      font-size: 0.82rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      display: none;
    }
    #form-status.success { display: block; background: rgba(63, 185, 80, 0.1); border: 1px solid rgba(63, 185, 80, 0.4); color: var(--green); }
    #form-status.error { display: block; background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.4); color: var(--red); }

    .site-footer {
      max-width: 900px; margin: 0 auto; width: 100%;
      padding: 2.5rem 1.5rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
      font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim);
    }

    @media (max-width: 640px) {
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="status-bar">
    <div class="status-bar-inner">
      <div class="status-left">
        <a href="https://chrispivonka.com" style="color: inherit; text-decoration: none;">chrispivonka.com</a>
      </div>
      <div class="status-right">
        <span id="live-clock">--:--:-- MST</span>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <div class="nav-left">
      <a href="./printing.html" class="nav-brand">
        <i class="bi bi-arrow-left"></i> 3d-printing
      </a>
      <span class="nav-sep">/</span>
      <span class="nav-current">request</span>
    </div>
    <a href="./printing.html" class="nav-pill-back">← back()</a>
  </nav>

  <main class="page-main">
    <div class="header-card">
      <h1><i class="bi bi-file-earmark-plus"></i> Request a Print</h1>
      <p>Upload a model and I'll queue it up on the printer.</p>
    </div>

    <form id="request-form">
      <div>
        <label for="file-input">Model file (.3mf or .stl)</label>
        <div class="file-drop" id="file-drop">
          <i class="bi bi-cloud-arrow-up"></i>
          <span id="file-drop-label">Click to choose a file, or drag one here</span>
          <div class="file-name" id="file-name-display"></div>
        </div>
        <input type="file" id="file-input" accept=".3mf,.stl" style="display:none;" required />
      </div>

      <div>
        <label for="material">Material</label>
        <select id="material" required>
          <option value="PLA">PLA</option>
          <option value="PLA+">PLA+</option>
          <option value="PETG">PETG</option>
          <option value="ABS">ABS</option>
          <option value="TPU">TPU</option>
          <option value="Other">Other (specify in notes)</option>
        </select>
      </div>

      <div class="field-row">
        <div>
          <label for="color">Color</label>
          <input type="text" id="color" placeholder="e.g. black, white, any" />
        </div>
        <div>
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="1" max="100" value="1" required />
        </div>
      </div>

      <div>
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low — whenever</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High — kind of need this soon</option>
        </select>
      </div>

      <div>
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Anything else — infill, supports, tolerances, what it's for..."></textarea>
      </div>

      <button type="submit" id="submit-btn">Submit Request</button>
      <div id="form-status"></div>
    </form>
  </main>

  <footer class="site-footer">
    <span>© <span id="current-year">2026</span> Chris Pivonka</span>
  </footer>

  <script type="module" src="./request-loader.js"></script>
</body>
</html>
